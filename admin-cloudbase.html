<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>艺活时空 · 后台管理（云端多人版）</title>
  <script src="https://imgcache.qq.com/qcloud/tcbjs/1.10.2/tcb.js"></script>
  <script src="./cloudbase-auth.js"></script>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --txt:#e6e8ee; --mut:#9aa3b2;
            --acc:#c8a06a; --ok:#46b97a; --err:#e06a6a; --blue:#5b8def; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,"PingFang SC",Segoe UI,sans-serif;
           background:var(--bg); color:var(--txt); padding:24px; }
    .wrap { max-width:920px; margin:0 auto; }
    h1 { font-size:20px; color:var(--acc); margin:0 0 4px; }
    .sub { color:var(--mut); font-size:13px; margin-bottom:20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:20px; margin-bottom:18px; }
    input,select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
            background:#0c0e12; color:var(--txt); font-size:14px; margin-bottom:10px; }
    button { cursor:pointer; border:none; border-radius:8px; padding:9px 16px; font-size:14px;
             background:var(--acc); color:#1a1206; font-weight:600; }
    button.ghost { background:transparent; color:var(--mut); border:1px solid var(--line); }
    button.danger { background:var(--err); color:#fff; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .row { display:flex; gap:8px; align-items:center; }
    .row > input, .row > select { margin-bottom:0; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--mut); font-weight:500; }
    td.code { font-family:ui-monospace,Menlo,monospace; color:var(--acc); }
    td.tgt { max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .msg { font-size:13px; margin-top:8px; min-height:18px; }
    .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
    .hidden { display:none; }
    .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px;
            background:#2a2f3a; color:var(--mut); }
    .pill.admin { background:rgba(200,160,106,.18); color:var(--acc); }
    .pill.editor { background:rgba(91,141,239,.18); color:var(--blue); }
    .pill.viewer { background:#2a2f3a; color:var(--mut); }
    hr { border:none; border-top:1px solid var(--line); margin:18px 0; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🛠️ 艺活时空 · 后台管理（云端多人版）</h1>
  <div class="sub">手机验证码 / 微信登录 · 默认只读 · 由管理员在「用户管理」授权。</div>

  <!-- 登录面板 -->
  <div id="loginPanel" class="card">
    <input id="phone" placeholder="手机号，如 13800000000" />
    <div class="row">
      <input id="code" placeholder="短信验证码" />
      <button id="sendCodeBtn" class="ghost">发送验证码</button>
    </div>
    <div class="row">
      <button id="loginBtn">手机登录</button>
      <button id="wxLoginBtn" class="ghost">微信登录</button>
    </div>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- 应用面板 -->
  <div id="appPanel" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div>当前用户：<b id="who"></b> <span id="rolePill" class="pill"></span></div>
        <div class="row">
          <button id="bindWxBtn" class="ghost hidden">绑定微信</button>
          <button id="logoutBtn" class="ghost">退出</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px;">新增 / 修改落地链接</h3>
      <input id="fCode" placeholder="编号，如 YJH-196" />
      <input id="fTarget" placeholder="跳转目标 https://..." />
      <div class="row">
        <button id="saveBtn">保存</button>
        <button id="clearBtn" class="ghost">清空</button>
      </div>
      <div id="formMsg" class="msg"></div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px;">现有链接（<span id="count">0</span>）</h3>
      <table>
        <thead><tr><th>编号</th><th>跳转目标</th><th>操作</th></tr></thead>
        <tbody id="list"></tbody>
      </table>
      <div id="listMsg" class="msg"></div>
    </div>

    <!-- 用户管理：仅 admin 可见 -->
    <div id="userMgmt" class="card hidden">
      <h3 style="margin:0 0 12px;">用户管理（授权）</h3>
      <table>
        <thead><tr><th>uid</th><th>手机</th><th>微信</th><th>角色</th><th>操作</th></tr></thead>
        <tbody id="userList"></tbody>
      </table>
      <hr />
      <div class="row">
        <input id="grantUid" placeholder="目标 uid" style="flex:2;" />
        <select id="grantRole" style="flex:1;">
          <option value="viewer">只读</option>
          <option value="editor">编辑</option>
          <option value="admin">管理员</option>
        </select>
        <button id="grantBtn">授权</button>
      </div>
      <div id="userMsg" class="msg"></div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let editing = null;

  function show(el, on) { el.classList.toggle('hidden', !on); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // 角色 → 权限
  function perms(role) {
    return {
      canAdd: role !== 'viewer',
      canEdit: role === 'admin',
      canDelete: role === 'admin',
      isAdmin: role === 'admin'
    };
  }
  const ROLE_LABEL = { admin: '管理员', editor: '编辑', viewer: '只读' };

  async function refresh() {
    const me = GalleryAuth.getMe();
    if (!me) { show($('loginPanel'), true); show($('appPanel'), false); return; }
    show($('loginPanel'), false); show($('appPanel'), true);
    const p = perms(me.role);

    $('who').textContent = me.uid || '';
    const pill = $('rolePill');
    pill.textContent = ROLE_LABEL[me.role] || me.role;
    pill.className = 'pill ' + (me.role || '');

    // 绑定微信按钮：viewer/editor/admin 都可在未绑时绑定
    const bound = me.weixinBound;
    show($('bindWxBtn'), !bound);

    // 编辑表单权限
    $('saveBtn').disabled = !p.canAdd;
    $('fCode').disabled = editing ? true : !p.canAdd;
    $('fTarget').disabled = !p.canAdd;

    // 用户管理区
    show($('userMgmt'), p.isAdmin);
    if (p.isAdmin) await loadUsers();

    // 链接列表
    const r = await GalleryAuth.callAdmin('mapping:list');
    if (r.error) { $('listMsg').className = 'msg err'; $('listMsg').textContent = r.error; return; }
    const data = r.data || {};
    const keys = Object.keys(data);
    $('count').textContent = keys.length;
    $('list').innerHTML = keys.map((k) => `
      <tr>
        <td class="code">${esc(k)}</td>
        <td class="tgt" title="${esc(data[k])}">${esc(data[k])}</td>
        <td class="row">
          ${p.canEdit ? `<button class="ghost" data-edit="${esc(k)}">改</button>` : ''}
          ${p.canDelete ? `<button class="danger" data-del="${esc(k)}">删</button>` : ''}
          ${(!p.canEdit && !p.canDelete) ? '<span class="msg">只读</span>' : ''}
        </td>
      </tr>`).join('');
    $('list').querySelectorAll('[data-edit]').forEach((b) =>
      b.onclick = () => startEdit(b.dataset.edit, data[b.dataset.edit]));
    if (p.canDelete) $('list').querySelectorAll('[data-del]').forEach((b) =>
      b.onclick = () => doDelete(b.dataset.del));
  }

  async function loadUsers() {
    const r = await GalleryAuth.callAuth('users:list');
    if (r.error) { $('userMsg').className = 'msg err'; $('userMsg').textContent = r.error; return; }
    const users = r.users || [];
    $('userList').innerHTML = users.map((u) => `
      <tr>
        <td class="code" title="${esc(u.uid)}">${esc(u.uid.slice(0, 12))}…</td>
        <td>${esc(u.phone || '-')}</td>
        <td>${u.weixinBound ? '✅' : '—'}</td>
        <td>${ROLE_LABEL[u.role] || u.role}</td>
        <td class="row">
          <select data-uid="${esc(u.uid)}" class="roleSel" style="width:auto;margin:0;">
            <option value="viewer" ${u.role==='viewer'?'selected':''}>只读</option>
            <option value="editor" ${u.role==='editor'?'selected':''}>编辑</option>
            <option value="admin" ${u.role==='admin'?'selected':''}>管理员</option>
          </select>
          <button class="ghost grantOne" data-uid="${esc(u.uid)}">设</button>
        </td>
      </tr>`).join('');
    $('userList').querySelectorAll('.grantOne').forEach((b) =>
      b.onclick = () => {
        const sel = b.parentElement.querySelector('.roleSel');
        doGrant(b.dataset.uid, sel.value);
      });
  }

  async function doGrant(uid, role) {
    const r = await GalleryAuth.callAuth('setRole', { uid, role });
    if (r.error) { $('userMsg').className = 'msg err'; $('userMsg').textContent = r.error; return; }
    $('userMsg').className = 'msg ok'; $('userMsg').textContent = `已授权 ${uid.slice(0,8)}… → ${ROLE_LABEL[role]}`;
    await loadUsers();
  }

  function startEdit(code, target) {
    editing = code;
    $('fCode').value = code; $('fCode').disabled = true;
    $('fTarget').value = target;
    $('saveBtn').textContent = '更新';
    $('formMsg').className = 'msg'; $('formMsg').textContent = '修改模式';
  }

  function clearForm() {
    editing = null;
    $('fCode').value = ''; $('fCode').disabled = !perms(GalleryAuth.getMe().role).canAdd;
    $('fTarget').value = '';
    $('saveBtn').textContent = '保存'; $('formMsg').textContent = '';
  }

  async function doSave() {
    if (!perms(GalleryAuth.getMe().role).canAdd) { $('formMsg').className='msg err'; $('formMsg').textContent='无权限'; return; }
    const code = $('fCode').value.trim();
    const target = $('fTarget').value.trim();
    if (!code || !target) { $('formMsg').className='msg err'; $('formMsg').textContent='编号与目标必填'; return; }
    const action = editing ? 'mapping:update' : 'mapping:add';
    const r = await GalleryAuth.callAdmin(action, { code, target });
    if (r.error) { $('formMsg').className='msg err'; $('formMsg').textContent = r.error; return; }
    $('formMsg').className='msg ok'; $('formMsg').textContent = (editing?'已更新':'已新增') + '：' + code;
    clearForm(); refresh();
  }

  async function doDelete(code) {
    if (!confirm('确认删除 ' + code + ' ？')) return;
    const r = await GalleryAuth.callAdmin('mapping:delete', { code });
    if (r.error) { $('listMsg').className='msg err'; $('listMsg').textContent = r.error; return; }
    refresh();
  }

  async function doSendCode() {
    const phone = $('phone').value.trim();
    if (!/^1\d{10}$/.test(phone)) { $('loginMsg').className='msg err'; $('loginMsg').textContent='手机号格式不正确'; return; }
    $('loginMsg').className='msg'; $('loginMsg').textContent='发送中…';
    try { await GalleryAuth.sendSmsCode(phone); $('loginMsg').className='msg ok'; $('loginMsg').textContent='验证码已发送'; }
    catch (e) { $('loginMsg').className='msg err'; $('loginMsg').textContent = e.message || '发送失败'; }
  }

  async function doLogin() {
    const phone = $('phone').value.trim(), code = $('code').value.trim();
    if (!/^1\d{10}$/.test(phone)) { $('loginMsg').className='msg err'; $('loginMsg').textContent='手机号格式不正确'; return; }
    if (!code) { $('loginMsg').className='msg err'; $('loginMsg').textContent='请输入验证码'; return; }
    $('loginMsg').className='msg'; $('loginMsg').textContent='登录中…';
    try {
      await GalleryAuth.loginPhone(phone, code);
      $('loginMsg').textContent=''; refresh();
    } catch (e) { $('loginMsg').className='msg err'; $('loginMsg').textContent = e.message || '登录失败'; }
  }

  async function doWxLogin() {
    $('loginMsg').className='msg'; $('loginMsg').textContent='微信登录中…';
    try { const me = await GalleryAuth.loginWeixin(); $('loginMsg').textContent=''; refresh(); }
    catch (e) { $('loginMsg').className='msg err'; $('loginMsg').textContent = e.message || '微信登录失败'; }
  }

  async function doBindWx() {
    $('userMsg').className='msg'; $('userMsg').textContent='绑定中…';
    try {
      const me = await GalleryAuth.linkWeixin();
      $('userMsg').className='msg ok'; $('userMsg').textContent='微信已绑定';
      refresh();
    } catch (e) { $('userMsg').className='msg err'; $('userMsg').textContent = e.message || '绑定失败'; }
  }

  async function doLogout() { await GalleryAuth.logout(); clearForm(); refresh(); }

  $('sendCodeBtn').onclick = doSendCode;
  $('loginBtn').onclick = doLogin;
  $('wxLoginBtn').onclick = doWxLogin;
  $('bindWxBtn').onclick = doBindWx;
  $('logoutBtn').onclick = doLogout;
  $('saveBtn').onclick = doSave;
  $('clearBtn').onclick = clearForm;
  $('grantBtn').onclick = () => doGrant($('grantUid').value.trim(), $('grantRole').value);

  (async () => { await GalleryAuth.init(); refresh(); })();
</script>
</body>
</html>
